<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel AGI Eléctrica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;650&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root{
    --paper:#f5f2ea; --surface:#ffffff; --surface-2:#faf7f0;
    --ink:#1c1f24; --ink-muted:#5b6169; --ink-faint:#8a8f98;
    --line:#dedacd; --line-strong:#c7c2b2;
    --accent:#2c5cc5; --accent-ink:#ffffff; --accent-soft:#e4ecfb;
    --good:#1f7a4d; --good-soft:#e4f3ea;
    --warning:#a8720c; --warning-soft:#fbf0dc;
    --critical:#c0392b; --critical-soft:#fceae8;
    --proj-raices:#3b6fd1; --proj-condell:#c77d2e; --proj-tsm:#2f9e82; --proj-cdp4:#8b5fbf; --proj-other:#6b7280;
    --cat-1:#3b6fd1; --cat-2:#2f9e82; --cat-3:#c77d2e; --cat-4:#8b5fbf; --cat-5:#b0507a; --cat-6:#6b8f3c; --cat-7:#4a7f9e; --cat-8:#9c6b3f;
    --shadow: 0 1px 2px rgba(28,31,36,.06), 0 4px 14px rgba(28,31,36,.05);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171b; --surface:#1b2027; --surface-2:#20262e;
      --ink:#e9e6dd; --ink-muted:#a0a7b0; --ink-faint:#6b7280;
      --line:#2a2f37; --line-strong:#394049;
      --accent:#6e9cf0; --accent-ink:#0b1220; --accent-soft:#1e2a44;
      --good:#4ade93; --good-soft:#163524;
      --warning:#f0b429; --warning-soft:#3a2c0e;
      --critical:#f1595c; --critical-soft:#3a1616;
      --proj-raices:#5b8ae6; --proj-condell:#b87330; --proj-tsm:#3faa90; --proj-cdp4:#a17ed1; --proj-other:#8a93a3;
      --cat-1:#5b8ae6; --cat-2:#3faa90; --cat-3:#d99b52; --cat-4:#a17ed1; --cat-5:#d17aa0; --cat-6:#8fb85e; --cat-7:#6fa5c2; --cat-8:#bd8a5c;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171b; --surface:#1b2027; --surface-2:#20262e;
    --ink:#e9e6dd; --ink-muted:#a0a7b0; --ink-faint:#6b7280;
    --line:#2a2f37; --line-strong:#394049;
    --accent:#6e9cf0; --accent-ink:#0b1220; --accent-soft:#1e2a44;
    --good:#4ade93; --good-soft:#163524;
    --warning:#f0b429; --warning-soft:#3a2c0e;
    --critical:#f1595c; --critical-soft:#3a1616;
    --proj-raices:#5b8ae6; --proj-condell:#b87330; --proj-tsm:#3faa90; --proj-cdp4:#a17ed1; --proj-other:#8a93a3;
    --cat-1:#5b8ae6; --cat-2:#3faa90; --cat-3:#d99b52; --cat-4:#a17ed1; --cat-5:#d17aa0; --cat-6:#8fb85e; --cat-7:#6fa5c2; --cat-8:#bd8a5c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; line-height:1.45;}
  h1,h2,h3{font-weight:650; text-wrap:balance; margin:0;}
  .num, .tabular{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-soft);}

  .shell{max-width:1180px; margin:0 auto; padding:0 20px 64px;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--paper);
    border-bottom:1px solid var(--line); padding:14px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand svg{width:26px; height:26px; flex:none;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text b{font-size:15px; letter-spacing:.01em;}
  .brand-text span{font-size:11.5px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.08em;}
  .snapshot-tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .snap-tab{
    font-family:"IBM Plex Mono",monospace; font-size:12.5px; padding:6px 11px;
    border:1px solid var(--line-strong); border-radius:999px; background:var(--surface);
    color:var(--ink-muted); cursor:pointer;
  }
  .snap-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* ---------- KPI row ---------- */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-top:26px;}
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; position:relative;
  }
  .kpi .label{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-muted); font-weight:600;}
  .kpi .value{font-family:"IBM Plex Mono",monospace; font-size:23px; font-weight:600; letter-spacing:-.01em;}
  .kpi .sub{font-size:12px; color:var(--ink-muted);}
  .kpi .pill{position:absolute; top:14px; right:14px; font-size:10px; padding:2px 7px; border-radius:999px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
  .pill.good{background:var(--good-soft); color:var(--good);}
  .pill.warning{background:var(--warning-soft); color:var(--warning);}
  .pill.critical{background:var(--critical-soft); color:var(--critical);}

  /* ---------- panels ---------- */
  .panel{margin-top:34px;}
  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .panel-head h2{font-size:18px;}
  .panel-head .src{font-size:11.5px; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace;}
  .empty-note{font-size:13px; color:var(--ink-muted); background:var(--surface); border:1px dashed var(--line-strong); border-radius:var(--radius); padding:16px; text-align:center;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}
  th,td{padding:9px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap;}
  th:first-child, td:first-child{text-align:left; white-space:normal;}
  th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); font-weight:600; background:var(--surface-2); position:sticky; top:0;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.total-row td{font-weight:650; background:var(--surface-2);}
  td.neg{color:var(--critical);}

  .chart-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 18px 6px;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-muted); margin-bottom:10px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px; height:10px; border-radius:2px; display:inline-block;}

  .proyectos-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px;}
  .proy-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
  .proy-card .proy-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .proy-dot{width:10px; height:10px; border-radius:50%; flex:none;}
  .proy-card h3{font-size:14.5px;}
  .proy-row{display:flex; justify-content:space-between; font-size:12.8px; padding:4px 0; color:var(--ink-muted);}
  .proy-row b{color:var(--ink); font-family:"IBM Plex Mono",monospace; font-weight:500;}
  .bar-track{height:7px; border-radius:99px; background:var(--surface-2); margin:10px 0 4px; overflow:hidden; border:1px solid var(--line);}
  .bar-fill{height:100%; border-radius:99px;}
  .bar-label{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint);}
  .proy-partidas-toggle{margin-top:10px; width:100%; text-align:left; background:none; border:none; padding:6px 0 0; font-size:11.5px; color:var(--accent); cursor:pointer; border-top:1px dashed var(--line); font-family:inherit;}
  .proy-partidas{display:none; margin-top:6px;}
  .proy-partidas.open{display:block;}
  .proy-partidas table{width:100%; border-collapse:collapse; font-size:11.5px;}
  .proy-partidas th{text-align:left; color:var(--ink-faint); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line);}
  .proy-partidas td{padding:4px 6px; color:var(--ink-muted); border-bottom:1px solid var(--line);}
  .proy-partidas td:first-child{color:var(--ink);}
  .proy-partidas td.num, .proy-partidas th:not(:first-child){text-align:right; font-family:"IBM Plex Mono",monospace;}

  .hh-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;}
  .hh-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
  .hh-card h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin-bottom:12px;}
  .hh-item{display:grid; grid-template-columns:88px 1fr 46px; align-items:center; gap:8px; font-size:12px; margin-bottom:7px;}
  .hh-item .hh-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-muted);}
  .hh-item .hh-track{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
  .hh-item .hh-fill{height:100%; background:var(--proj-raices); border-radius:4px;}
  .hh-item .hh-val{font-family:"IBM Plex Mono",monospace; text-align:right; color:var(--ink);}
  .hh-item-click{cursor:pointer; border-radius:6px; padding:3px 4px; margin:0 -4px 7px; transition:background .12s;}
  .hh-item-click:hover{background:var(--surface-2);}
  .hh-item-click.active{background:var(--accent-soft);}
  .hh-item-click.active .hh-name{color:var(--accent);}
  .cxc-filter-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    font-size:12.5px; color:var(--ink-muted); background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:8px; padding:8px 12px; margin-bottom:10px;
  }
  .cxc-filter-clear{
    font:600 12px "IBM Plex Sans",sans-serif; color:var(--accent); background:none; border:1px solid var(--accent);
    border-radius:6px; padding:4px 10px; cursor:pointer;
  }
  .cxc-filter-clear:hover{background:var(--accent-soft);}

  .hh-toolbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .hh-filter-tab{border:1px solid var(--line-strong); border-radius:999px; background:var(--surface); padding:6px 14px; font-size:12.5px; color:var(--ink-muted); cursor:pointer; font-family:inherit;}
  .hh-filter-tab.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .hh-filter-sub{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px;}
  .hh-filter-chip{border:1px dashed var(--line-strong); border-radius:999px; background:var(--surface-2); padding:4px 12px; font-size:11.5px; color:var(--ink-muted); cursor:pointer; font-family:inherit;}
  .hh-filter-chip.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); border-style:solid;}
  .hh-context-stat{font-size:12px; color:var(--ink-faint); margin:-2px 0 14px; font-family:"IBM Plex Mono",monospace;}
  .donut-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-bottom:14px;}
  .donut-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;}
  .donut-card h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); margin-bottom:12px;}
  .donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .donut-wrap svg{flex:none;}
  .donut-legend{display:flex; flex-direction:column; gap:5px; min-width:150px; flex:1;}
  .donut-legend-row{display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:7px; font-size:12px;}
  .donut-legend-row .sw{width:10px; height:10px; border-radius:3px;}
  .donut-legend-row .lbl{color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .donut-legend-row .val{font-family:"IBM Plex Mono",monospace; color:var(--ink); font-size:11.5px; white-space:nowrap;}

  .tooltip{
    position:fixed; pointer-events:none; background:var(--ink); color:var(--paper); font-size:12px;
    font-family:"IBM Plex Mono",monospace; padding:8px 10px; border-radius:7px; box-shadow:var(--shadow);
    opacity:0; transform:translate(-50%,-110%); transition:opacity .08s; z-index:50; white-space:nowrap;
  }
  :root[data-theme="dark"] .tooltip, @media (prefers-color-scheme:dark){ .tooltip{color:var(--paper);} }

  footer{margin-top:48px; padding-top:20px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-faint); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;}

  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  @media (max-width:640px){
    .kpis{grid-template-columns:1fr 1fr;}
    th,td{padding:7px 8px; font-size:12px;}
  }

  [hidden]{ display:none !important; }
</style>
</head>
<body>

<div class="shell" id="app">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor" style="color:var(--accent)"/></svg>
      <div class="brand-text"><b>Panel AGI Eléctrica</b><span>Control de Gestión · Trei</span></div>
    </div>
    <div class="snapshot-tabs" id="snapshotTabs"></div>
  </header>

  <main>
    <section class="kpis" id="kpiRow"></section>

    <section class="panel">
      <div class="panel-head"><h2>Flujo de caja mensual</h2><span class="src" id="srcFlujo"></span></div>
      <div class="chart-card">
        <div class="legend">
          <span><i style="background:var(--good)"></i>Ingresos</span>
          <span><i style="background:var(--ink-faint)"></i>Egresos</span>
          <span><i style="background:var(--accent)"></i>Flujo acumulado</span>
        </div>
        <svg id="flujoChart" width="100%" viewBox="0 0 1120 320" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Control de costos por proyecto</h2><span class="src" id="srcProyectos"></span></div>
      <div class="donut-row" id="proyectosDonutRow"></div>
      <div class="proyectos-grid" id="proyectosGrid"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Cuentas por cobrar</h2><span class="src" id="srcCxc"></span></div>
      <div id="cxcWrap"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Horas hombre</h2><span class="src" id="srcHh"></span></div>
      <div class="hh-toolbar" id="hhAreaTabs"></div>
      <div class="hh-filter-sub" id="hhPersonaChips"></div>
      <div class="hh-context-stat" id="hhContextStat"></div>
      <div class="donut-row" id="hhDonutRow"></div>
      <div class="hh-grid" id="hhGrid"></div>
    </section>

    <footer>
      <span>Sitio estático, sin login ni servidor — Sebastián actualiza los datos cada mes.</span>
      <span id="lastUpdated"></span>
    </footer>
  </main>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
(function(){
  "use strict";

  /* ================= utilities ================= */
  const $ = (id) => document.getElementById(id);
  const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const MONTH_LABELS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const strip = (s) => String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g,"").trim().toLowerCase();

  function num(v){
    if (typeof v === "number") return v;
    if (v == null || v === "" || v === "-" || v === "—") return 0;
    let s = String(v).trim();
    if (s === "" || s === "-") return 0;
    const neg = /^\(.*\)$/.test(s);
    s = s.replace(/[()]/g,"").replace(/[^0-9.,-]/g,"");
    if (s.indexOf(",") > -1 && s.indexOf(".") > -1) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",", ".");
      else s = s.replace(/,/g,"");
    } else if (s.indexOf(",") > -1) {
      s = s.replace(/\./g,"").replace(",", ".");
    }
    const n = parseFloat(s);
    if (isNaN(n)) return 0;
    return neg ? -n : n;
  }
  function fmtMoney(n, opts){
    opts = opts || {};
    const abs = Math.abs(n);
    let s;
    if (opts.compact && abs >= 1000000) s = (n/1000000).toLocaleString("es-CL",{maximumFractionDigits:1}) + "M";
    else s = Math.round(n).toLocaleString("es-CL");
    return (opts.prefix || "$") + s;
  }
  function fmtNum(n, dec){ return n.toLocaleString("es-CL",{minimumFractionDigits:dec||0, maximumFractionDigits:dec||0}); }
  function pct(n){ return (n*100).toLocaleString("es-CL",{maximumFractionDigits:1}) + "%"; }
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c => c && e.appendChild(c));
    return e;
  }
  function aoa(ws){ return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""}); }
  function firstNonEmpty(row){ for (let i=0;i<row.length;i++) if (String(row[i]).trim() !== "") return {i, v: row[i]}; return null; }

  const tooltip = $("tooltip");
  function showTip(x,y,html){ tooltip.innerHTML = html; tooltip.style.left = x+"px"; tooltip.style.top = y+"px"; tooltip.style.opacity = 1; }
  function hideTip(){ tooltip.style.opacity = 0; }

  const PROJECT_COLORS = { "raices":"var(--proj-raices)","peñablanca":"var(--proj-raices)","condell":"var(--proj-condell)","tsm":"var(--proj-tsm)","santa maria":"var(--proj-tsm)","terraza":"var(--proj-tsm)","cdp4":"var(--proj-cdp4)","pinar":"var(--proj-cdp4)" };
  function colorForProject(name){
    const k = strip(name);
    for (const key in PROJECT_COLORS) if (k.indexOf(key) > -1) return PROJECT_COLORS[key];
    return "var(--proj-other)";
  }

  /* ================= gráficos de torta/dona (vistas por proyecto) ================= */
  const CAT_PALETTE = ["--cat-1","--cat-2","--cat-3","--cat-4","--cat-5","--cat-6","--cat-7","--cat-8"];
  function catColor(i){ return i < CAT_PALETTE.length ? "var(" + CAT_PALETTE[i] + ")" : "var(--ink-faint)"; }
  // Agrupa todo lo que exceda maxSlices en un ítem "Otros" — nunca una torta arcoíris de más de 8 colores.
  function topWithOthers(items, maxSlices){
    maxSlices = maxSlices || 7;
    if (items.length <= maxSlices) return items;
    const top = items.slice(0, maxSlices);
    const restSum = items.slice(maxSlices).reduce((a,[,v]) => a+v, 0);
    return restSum > 0 ? top.concat([["Otros", restSum]]) : top;
  }
  // Dona SVG (stroke-dasharray sobre un círculo) con centro numérico y leyenda directa —
  // mismo tipo de gráfico que las tortas de Power BI, con paleta fija y separación entre tramos.
  function donutChart(items, opts){
    opts = opts || {};
    if (!items || !items.length) return el("div", {class:"empty-note", text:"Sin datos para este filtro."});
    const size = opts.size || 168, sw = opts.stroke || 24;
    const fmtVal = opts.formatValue || ((v) => fmtNum(v,1) + " h");
    const unitLabel = opts.unitLabel != null ? opts.unitLabel : "horas";
    const r = (size - sw) / 2, C = 2 * Math.PI * r;
    const shown = topWithOthers(items, opts.maxSlices || 7);
    const total = shown.reduce((a,[,v]) => a + v, 0) || 1;
    const gap = shown.length > 1 ? 3 : 0;
    let offset = 0, arcs = "";
    shown.forEach(([label, val], i) => {
      const frac = val / total;
      const len = Math.max(0, frac * C - gap);
      const color = label === "Otros" ? "var(--ink-faint)" : catColor(i);
      arcs += `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" ` +
        `stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})">` +
        `<title>${label}: ${fmtVal(val)} (${pct(frac)})</title></circle>`;
      offset += frac * C;
    });
    const wrap = el("div", {class:"donut-wrap"});
    const centerVal = opts.centerText || fmtVal(total);
    wrap.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}` +
      `<text x="${size/2}" y="${size/2-5}" text-anchor="middle" font-family="IBM Plex Mono" font-size="${centerVal.length>7?14:19}" font-weight="600" fill="var(--ink)">${centerVal}</text>` +
      (unitLabel ? `<text x="${size/2}" y="${size/2+14}" text-anchor="middle" font-family="IBM Plex Sans" font-size="10" fill="var(--ink-faint)">${unitLabel}</text>` : "") + `</svg>`;
    const legend = el("div", {class:"donut-legend"});
    shown.forEach(([label, val], i) => {
      const color = label === "Otros" ? "var(--ink-faint)" : catColor(i);
      const row = el("div", {class:"donut-legend-row"}, [
        el("span", {class:"sw"}),
        el("span", {class:"lbl", text:label, title:label}),
        el("span", {class:"val", text: fmtVal(val) + " · " + pct(val/total)})
      ]);
      row.querySelector(".sw").style.background = color;
      legend.appendChild(row);
    });
    wrap.appendChild(legend);
    return wrap;
  }
  // Recalcula "por proyecto" y "por tipo de cliente" a partir del detalle fila-a-fila,
  // filtrando por área y/o persona — así los tabs de la vista por proyecto no necesitan
  // volver a leer el Excel, solo re-agregan lo que ya se parseó una vez.
  function hhAggregate(rows, filterArea, filterPersona){
    const filtered = rows.filter(r => (!filterArea || r.area === filterArea) && (!filterPersona || r.persona === filterPersona));
    const byProyecto = {}, byCategoria = {};
    let total = 0;
    filtered.forEach(r => {
      byProyecto[r.proyecto] = (byProyecto[r.proyecto]||0) + r.horas;
      byCategoria[r.categoria] = (byCategoria[r.categoria]||0) + r.horas;
      total += r.horas;
    });
    const toSorted = (obj) => Object.entries(obj).sort((a,b)=>b[1]-a[1]);
    return { total, porProyecto: toSorted(byProyecto), porCategoria: toSorted(byCategoria) };
  }

  /* ================= state ================= */
  const state = {
    snapshots: [demoSnapshotJun(), demoSnapshotJul(), demoSnapshot()], // uno por archivo "Panel financiero Total" mensual (Junio, Julio, Agosto 2026)
    activeSnapshot: 2, // Agosto 2026 (mes más reciente) por defecto
    cxc: null, cxcIsDemo: true,
    hh: null, hhIsDemo: true,
    manifest: []           // {name, type, note}
  };
  const hhFilter = { area: null, persona: null }; // vista por proyecto: filtro activo en la sección Horas Hombre
  const cxcFilter = { bucket: null }; // antigüedad de cartera: bucket activo en la sección Cuentas por Cobrar

  /* ================= classification ================= */
  function classifyWorkbook(wb){
    const sheetNames = wb.SheetNames.map(strip);
    if (sheetNames.some(n => n === "resumen general") || sheetNames.some(n => /^(cc|ig|ing)-/.test(n))) return "panel";
    const first = wb.Sheets[wb.SheetNames[0]];
    const text = strip(XLSX.utils.sheet_to_csv(first, {blankrows:false}).slice(0,4000));
    if (text.indexOf("informe estado de cuenta") > -1 || (text.indexOf("codigo:") > -1 && text.indexOf("nombre:") > -1)) return "cxc";
    if (sheetNames.some(n => n === "registro")) return "hh";
    for (const sn of wb.SheetNames){
      const rows = aoa(wb.Sheets[sn]).slice(0,15);
      for (const row of rows){
        const cells = row.map(strip);
        const hasProj = cells.some(c => c.indexOf("proyecto") > -1);
        const hasHoras = cells.some(c => c.indexOf("horas") > -1 || c === "hh");
        const hasPersona = cells.some(c => c.indexOf("persona") > -1);
        if ((hasProj && hasHoras) || (hasPersona && hasHoras)) return "hh";
      }
    }
    return "unknown";
  }

  /* ================= parse: Panel Financiero (Resumen General + CC-* + IG-*) ================= */
  function parseResumenGeneral(ws){
    const rows = aoa(ws);
    let monthCols = null, totalCol = null, headerRowIdx = -1;
    for (let r=0;r<rows.length;r++){
      const cells = rows[r].map(strip);
      let found = 0; const cols = {};
      MONTHS.forEach((m,mi) => { const idx = cells.indexOf(m); if (idx > -1){ cols[mi]=idx; found++; } });
      if (found >= 8){ monthCols = cols; headerRowIdx = r; const tIdx = cells.findIndex(c=>c.indexOf("total")>-1); if (tIdx>-1) totalCol = tIdx; break; }
    }
    if (!monthCols) return null;
    const lines = [];
    for (let r=headerRowIdx+1;r<rows.length;r++){
      const row = rows[r];
      const fne = firstNonEmpty(row);
      if (!fne) continue;
      const label = String(fne.v).trim();
      if (!label) continue;
      const values = MONTHS.map((m,mi) => monthCols[mi] != null ? num(row[monthCols[mi]]) : 0);
      const total = totalCol != null ? num(row[totalCol]) : values.reduce((a,b)=>a+b,0);
      lines.push({label, raw: label.toUpperCase(), values, total, indent: (String(row[0]||"").match(/^\s*/)||[""])[0].length});
    }
    const findLine = (name) => lines.find(l => l.raw === name);
    return {
      lines,
      totalIngresos: findLine("TOTAL INGRESOS"),
      totalEgresos: findLine("TOTAL EGRESOS"),
      flujoCaja: findLine("FLUJO DE CAJA"),
      flujoAcumulado: findLine("FLUJO DE CAJA ACUMULADO")
    };
  }

  function parseCCSheet(ws){
    const rows = aoa(ws);
    const keys = { presupuesto:/presupuesto/, proyeccion:/proyecci/, resultado:/^resultado$/, utilidad:/utilidad/ };
    let headerRow = -1; const colMap = {};
    for (let r=0;r<Math.min(rows.length,6);r++){
      const cells = rows[r].map(strip);
      let hits = 0;
      cells.forEach((c,ci) => { for (const k in keys){ if (keys[k].test(c) && colMap[k]==null){ colMap[k]=ci; hits++; } } });
      if (hits >= 3){ headerRow = r; break; }
    }
    if (headerRow === -1) return null;
    const totals = {presupuesto:0, proyeccion:0, resultado:0, utilidad:0};
    const partidas = [];
    for (let r=headerRow+1; r<Math.min(headerRow+6, rows.length); r++){
      const row = rows[r];
      const label = String(row[0]||"").trim();
      if (!label) break;
      const line = {
        label,
        presupuesto: num(row[colMap.presupuesto]),
        proyeccion: num(row[colMap.proyeccion]),
        resultado: num(row[colMap.resultado]),
        utilidad: num(row[colMap.utilidad])
      };
      totals.presupuesto += line.presupuesto;
      totals.proyeccion += line.proyeccion;
      totals.resultado += line.resultado;
      totals.utilidad += line.utilidad;
      partidas.push(line);
    }
    // Solo vale la pena mostrar el desglose si hay más de una partida — si la hoja
    // trae una única fila (ya es el total), el desglose no aporta nada nuevo.
    totals.partidas = partidas.length > 1 ? partidas : [];
    return totals;
  }

  function parseIGTotal(ws){
    const rows = aoa(ws);
    for (let r=0;r<Math.min(rows.length,8);r++){
      const cells = rows[r];
      const labelIdx = cells.findIndex(c => strip(c) === "total");
      if (labelIdx > -1){
        for (let c=labelIdx+1;c<cells.length;c++){ const n = num(cells[c]); if (n) return n; }
      }
    }
    return null;
  }

  function niceProjectName(sheetSuffix){
    const map = {raices:"Raíces de Peñablanca", condell:"Condell", tsm:"Terraza Santa María", cdp4:"Cumbres del Pinar 4"};
    return map[strip(sheetSuffix)] || sheetSuffix;
  }

  function detectMonthLabel(fileName, resumen){
    const m = fileName.match(/(\d{4})[-_ ]?(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)/i);
    const monthNames = {ene:"Enero",feb:"Febrero",mar:"Marzo",abr:"Abril",may:"Mayo",jun:"Junio",jul:"Julio",ago:"Agosto",sep:"Septiembre",oct:"Octubre",nov:"Noviembre",dic:"Diciembre"};
    if (m) return monthNames[strip(m[2])] + " " + m[1];
    return fileName.replace(/\.(xlsx|xls|csv)$/i,"");
  }

  function parsePanelWorkbook(wb, fileName){
    let resumen = null;
    for (const name of wb.SheetNames) if (strip(name) === "resumen general") resumen = parseResumenGeneral(wb.Sheets[name]);
    const proyectos = [];
    wb.SheetNames.forEach(name => {
      const m = name.match(/^CC-(.+)$/i);
      if (m){
        const cc = parseCCSheet(wb.Sheets[name]);
        if (cc){
          const igName = wb.SheetNames.find(n => strip(n) === strip("IG-" + m[1]));
          const gastoIG = igName ? parseIGTotal(wb.Sheets[igName]) : null;
          proyectos.push(Object.assign({ name: niceProjectName(m[1]), sheet: name, gastoIG }, cc));
        }
      }
    });
    return { fileName, label: detectMonthLabel(fileName, resumen), resumen, proyectos, sheetCount: wb.SheetNames.length };
  }

  /* ================= parse: Cuentas por Cobrar ================= */
  // Antigüedad de cartera: el export Softland trae, dentro del bloque de cada cliente, una
  // tabla documento-a-documento (típicamente Fecha | Documento | Glosa | Debe | Haber | Saldo)
  // que hoy solo se usaba para llegar a la fila "Total". Si esa tabla trae una columna "Fecha" y
  // una columna "Saldo", las capturamos para poder clasificar cada documento por antigüedad
  // (0-30 / 31-60 / 61-90 / +90 días desde su fecha). Es un cálculo oportunista: si el formato
  // de un archivo no trae esas columnas en ese bloque, simplemente no se detecta nada y esta
  // vista no aparece — no se inventa ni se estima ninguna fecha.
  const AGING_BUCKETS = ["Al día (0-30d)", "31-60 días", "61-90 días", "Más de 90 días"];
  function agingBucket(dias){
    if (dias <= 30) return AGING_BUCKETS[0];
    if (dias <= 60) return AGING_BUCKETS[1];
    if (dias <= 90) return AGING_BUCKETS[2];
    return AGING_BUCKETS[3];
  }
  function parseCxC(wb){
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = aoa(ws);
    const clients = [];
    let current = null;
    let grandTotal = null;
    let dateCol = null, saldoDocCol = null;
    const todayMs = Date.now();
    const buckets = {}; AGING_BUCKETS.concat("Sin fecha").forEach(k => buckets[k] = 0);
    let anyAging = false;
    for (let r=0;r<rows.length;r++){
      const row = rows[r];
      const c0 = strip(row[0]);
      if (c0.indexOf("codigo") === 0 || c0 === "codigo:"){
        const nameIdx = row.findIndex(c => strip(c).indexOf("nombre") === 0);
        const codeVal = row[row.findIndex(c=>strip(c).indexOf("codigo")===0)+1];
        const nameVal = nameIdx > -1 ? row[nameIdx+1] : null;
        current = { code: String(codeVal||"").trim(), name: String(nameVal||"").trim(), debe:0, haber:0, saldo:0, docs:0, docsDetalle:[] };
        dateCol = null; saldoDocCol = null;
        continue;
      }
      if (current && dateCol == null && c0 !== "total"){
        const cells = row.map(strip);
        const fIdx = cells.findIndex(c => c.indexOf("fecha") > -1);
        const sIdx = cells.findIndex(c => c.indexOf("saldo") > -1);
        if (fIdx > -1 && sIdx > -1){ dateCol = fIdx; saldoDocCol = sIdx; }
      } else if (current && dateCol != null && c0 !== "total" && c0){
        const fecha = excelSerialToDate(row[dateCol]);
        const saldoDoc = num(row[saldoDocCol]);
        if (fecha && saldoDoc) current.docsDetalle.push({fecha, saldo: saldoDoc});
      }
      if (current && c0 === "total"){
        const rest = row.slice(1).map(v=>String(v).trim()).filter(Boolean);
        if (rest[0] && strip(rest[0]) === strip(current.name)){
          const nonZero = row.map((v,i)=>({v:num(v),i})).filter(x=>x.i>0 && x.v!==0);
          if (nonZero.length){
            current.saldo = nonZero[nonZero.length-1].v;
            current.debe = nonZero[0].v;
          }
          if (current.docsDetalle.length){
            anyAging = true;
            let peorDias = 0;
            current.docsDetalle.forEach(d => {
              const dias = Math.floor((todayMs - d.fecha.getTime()) / 86400000);
              if (dias > peorDias) peorDias = dias;
              buckets[agingBucket(dias)] += d.saldo;
            });
            current.diasMora = peorDias;
          } else {
            buckets["Sin fecha"] += current.saldo;
          }
          clients.push(current);
          current = null; dateCol = null; saldoDocCol = null;
        }
      }
      if (row.some(c => strip(c) === "total:")){
        const numericTail = row.map(num).filter(n => n !== 0);
        if (numericTail.length) grandTotal = numericTail[numericTail.length-1];
      }
    }
    clients.sort((a,b)=> b.saldo - a.saldo);
    return {
      clients,
      grandTotal: grandTotal != null ? grandTotal : clients.reduce((a,c)=>a+c.saldo,0),
      hasAging: anyAging,
      buckets
    };
  }

  /* ================= parse: Horas Hombre ================= */
  // Fuente real confirmada (desde el .pbix): Alex mantiene "Control_HH_Proyectos.Rev2.xlsx"
  // en su equipo, con hojas "Registro" (un registro por actividad: fecha, proyecto, persona,
  // HH trabajadas) y "Proyectos" (catálogo con HH presupuestadas). El Power BI solo la lee
  // y la resume — así que si nos comparten ese mismo Excel mensualmente, no hace falta
  // pasar por Power BI en absoluto. Mapeo persona→área tomado tal cual del propio Power Query
  // de Alex (Table.AddColumn "Personalizado" en la consulta Registro_HH); un nombre nuevo que
  // no esté aquí cae en "Sin área" en vez de romper el parseo.
  const PERSON_AREA = {
    "martin rodrigues":"Terreno", "gonzalo armijo":"Terreno",
    "daniel mesa":"Ingenieria", "alex balboa":"Gerencia"
  };
  function excelSerialToDate(v){
    if (v instanceof Date) return isNaN(v) ? null : v;
    if (typeof v === "string"){
      const s = v.trim();
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m){ const d = new Date(+m[1], +m[2]-1, +m[3]); return isNaN(d) ? null : d; }
      m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
      if (m){ const d = new Date(+m[3], +m[2]-1, +m[1]); return isNaN(d) ? null : d; } // dd-mm-aaaa (formato chileno)
    }
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return null;
    const utcDays = Math.floor(n - 25569);
    const d = new Date(utcDays * 86400 * 1000);
    return isNaN(d) ? null : d;
  }
  function classifyClienteArea(v){
    const c = strip(v);
    if (!c) return "Sin categoría";
    if (c === "trei") return "Cliente_Interno";
    if (c.indexOf("area interna") > -1) return "Oficina_Central";
    return "Cliente_Externo";
  }
  function findSheetByNameOrSignature(wb, exactName, signatureFn){
    for (const n of wb.SheetNames){ if (strip(n) === exactName) return wb.Sheets[n]; }
    for (const n of wb.SheetNames){
      const rows = aoa(wb.Sheets[n]).slice(0,8);
      if (rows.some(row => signatureFn(row.map(strip)))) return wb.Sheets[n];
    }
    return null;
  }
  function parseProyectosCatalogo(ws){
    if (!ws) return null;
    const rows = aoa(ws);
    let headerRow = -1; const col = {};
    for (let r=0;r<Math.min(rows.length,8);r++){
      const cells = rows[r].map(strip);
      const codIdx = cells.findIndex(c => c.indexOf("codigo") > -1);
      const nomIdx = cells.findIndex(c => c.indexOf("nombre") > -1 && c.indexOf("proyecto") > -1);
      const cliIdx = cells.findIndex(c => c.indexOf("cliente") > -1);
      if (codIdx > -1 && nomIdx > -1 && cliIdx > -1){
        headerRow = r; col.codigo = codIdx; col.nombre = nomIdx; col.cliente = cliIdx;
        col.presup = cells.findIndex(c => c.indexOf("presupuestad") > -1);
        col.consumido = cells.findIndex(c => c.indexOf("consumid") > -1);
        break;
      }
    }
    if (headerRow === -1) return null;
    const byNombre = {}, byCodigo = {};
    for (let r=headerRow+1;r<rows.length;r++){
      const row = rows[r];
      const nombre = String(row[col.nombre]||"").trim();
      const codigo = String(row[col.codigo]||"").trim();
      if (!nombre && !codigo) continue;
      const entry = {
        categoria: classifyClienteArea(row[col.cliente]),
        presupuesto: col.presup > -1 ? num(row[col.presup]) : null,
        consumido: col.consumido > -1 ? num(row[col.consumido]) : null
      };
      if (nombre) byNombre[strip(nombre)] = entry;
      if (codigo) byCodigo[strip(codigo)] = entry;
    }
    return { byNombre, byCodigo };
  }
  // Formato rico: hoja "Registro" (una fila por actividad) + hoja "Proyectos" opcional.
  function parseHHRegistro(wb){
    const ws = findSheetByNameOrSignature(wb, "registro", cells =>
      cells.some(c=>c.indexOf("persona")>-1) && cells.some(c=>c.indexOf("horas trabajadas")>-1 || c.indexOf("hh trabajadas")>-1));
    if (!ws) return null;
    const rows = aoa(ws);
    let headerRow = -1; const col = {};
    for (let r=0;r<Math.min(rows.length,8);r++){
      const cells = rows[r].map(strip);
      const personaIdx = cells.findIndex(c => c.indexOf("persona") > -1);
      const horasIdx = cells.findIndex(c => c.indexOf("horas trabajadas") > -1 || c.indexOf("hh trabajadas") > -1 || c === "hh");
      if (personaIdx > -1 && horasIdx > -1){
        headerRow = r; col.persona = personaIdx; col.horas = horasIdx;
        col.fecha = cells.findIndex(c => c.indexOf("fecha") > -1);
        col.nombreProy = cells.findIndex(c => c.indexOf("nombre") > -1 && c.indexOf("proyecto") > -1);
        col.codigoProy = cells.findIndex(c => c.indexOf("codigo") > -1 && c.indexOf("proyecto") > -1);
        break;
      }
    }
    if (headerRow === -1) return null;
    const proyectosSheet = findSheetByNameOrSignature(wb, "proyectos", cells =>
      cells.some(c=>c.indexOf("codigo")>-1) && cells.some(c=>c.indexOf("cliente")>-1) && cells.some(c=>c.indexOf("nombre")>-1 && c.indexOf("proyecto")>-1));
    const catalogo = parseProyectosCatalogo(proyectosSheet);

    const byProyecto={}, byPersona={}, byArea={}, byCategoria={}, byMes={};
    const detailRows = [];
    let total = 0, minDate = null, maxDate = null;
    for (let r=headerRow+1;r<rows.length;r++){
      const row = rows[r];
      const persona = String(row[col.persona]||"").trim();
      const h = num(row[col.horas]);
      if (!persona || !h) continue;
      const proyNombre = col.nombreProy > -1 ? String(row[col.nombreProy]||"").trim() : "";
      const proyCodigo = col.codigoProy > -1 ? String(row[col.codigoProy]||"").trim() : "";
      const proyDisplay = proyNombre || proyCodigo || "Sin proyecto";
      byProyecto[proyDisplay] = (byProyecto[proyDisplay]||0) + h;
      byPersona[persona] = (byPersona[persona]||0) + h;
      total += h;
      const area = PERSON_AREA[strip(persona)] || "Sin área";
      byArea[area] = (byArea[area]||0) + h;
      let categoria = "Sin categoría";
      if (catalogo){
        const entry = (proyNombre && catalogo.byNombre[strip(proyNombre)]) || (proyCodigo && catalogo.byCodigo[strip(proyCodigo)]);
        if (entry) categoria = entry.categoria;
      }
      byCategoria[categoria] = (byCategoria[categoria]||0) + h;
      detailRows.push({persona, area, categoria, proyecto: proyDisplay, horas: h});
      if (col.fecha > -1){
        const d = excelSerialToDate(row[col.fecha]);
        if (d){
          if (!minDate || d < minDate) minDate = d;
          if (!maxDate || d > maxDate) maxDate = d;
          const key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
          if (!byMes[key]) byMes[key] = { label: MONTH_LABELS[d.getMonth()] + " " + d.getFullYear(), value: 0, order: d.getFullYear()*12 + d.getMonth() };
          byMes[key].value += h;
        }
      }
    }
    if (!total) return null;
    const toSorted = (obj) => Object.entries(obj).sort((a,b)=>b[1]-a[1]);
    const porMes = Object.values(byMes).sort((a,b)=>a.order-b.order).map(m => [m.label, Math.round(m.value*10)/10]);
    let ejecucion = null;
    if (catalogo){
      const list = [];
      Object.keys(byProyecto).forEach(name => {
        const entry = catalogo.byNombre[strip(name)];
        if (entry && entry.presupuesto) list.push({name, presupuesto: entry.presupuesto, consumido: byProyecto[name]});
      });
      if (list.length){ list.sort((a,b) => (b.consumido/b.presupuesto) - (a.consumido/a.presupuesto)); ejecucion = list; }
    }
    let periodo = null;
    if (minDate && maxDate){
      const a = MONTH_LABELS[minDate.getMonth()] + " " + minDate.getFullYear();
      const b = MONTH_LABELS[maxDate.getMonth()] + " " + maxDate.getFullYear();
      periodo = a === b ? a : (a + " – " + b);
    }
    return {
      total, isReal:true, periodo,
      porProyecto: toSorted(byProyecto), porPersona: toSorted(byPersona),
      porArea: toSorted(byArea), porCategoria: toSorted(byCategoria), porMes, ejecucion,
      rows: detailRows
    };
  }
  // Formato de respaldo: cualquier tabla plana con columnas Proyecto + Horas (por si en el
  // futuro alguien exporta un resumen ya agregado, sin el detalle de Registro).
  function parseHHFlat(wb){
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = aoa(ws);
    let headerRow = -1; const col = {};
    for (let r=0;r<Math.min(rows.length,10);r++){
      const cells = rows[r].map(strip);
      const pIdx = cells.findIndex(c => c.indexOf("proyecto") > -1);
      const hIdx = cells.findIndex(c => c.indexOf("horas") > -1 || c === "hh");
      if (pIdx > -1 && hIdx > -1){
        headerRow = r; col.proyecto = pIdx; col.horas = hIdx;
        col.area = cells.findIndex(c => c.indexOf("area") > -1 || c.indexOf("departamento") > -1);
        col.categoria = cells.findIndex(c => c.indexOf("categoria") > -1 || c.indexOf("tipo cliente") > -1);
        break;
      }
    }
    if (headerRow === -1) return null;
    const byProyecto = {}, byArea = {}, byCategoria = {};
    let total = 0;
    for (let r=headerRow+1;r<rows.length;r++){
      const row = rows[r];
      const proy = String(row[col.proyecto]||"").trim();
      const h = num(row[col.horas]);
      if (!proy || !h) continue;
      byProyecto[proy] = (byProyecto[proy]||0) + h;

    }
    if (!total) return null;
    const toSorted = (obj) => Object.entries(obj).sort((a,b)=>b[1]-a[1]);
    return { total, isReal:true, periodo:null, porProyecto: toSorted(byProyecto), porPersona:[], porArea: toSorted(byArea), porCategoria: toSorted(byCategoria), porMes:[], ejecucion:null, rows: [] };

  function renderFlujo(snap){
    const svg = $("flujoChart");
    svg.innerHTML = "";
    if (!snap.resumen || !snap.resumen.totalIngresos){
      svg.parentElement.innerHTML = "";
      svg.parentElement.appendChild(el("div", {class:"empty-note", text:"No encontré la hoja 'Resumen General' en este archivo. Revisa que tenga el mismo formato del libro AGI SPA."}));
      return;
    }
    const ing = snap.resumen.totalIngresos.values, egr = snap.resumen.totalEgresos.values;
    const flujoAcc = snap.resumen.flujoAcumulado ? snap.resumen.flujoAcumulado.values : (() => { let a=0; return ing.map((v,i)=>a+=(v-egr[i])); })();
    const W = 1120, H = 320, padL = 56, padR = 16, padT = 16, padB = 34;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const maxBar = Math.max(1, ...ing, ...egr);
    const minAcc = Math.min(0, ...flujoAcc), maxAcc = Math.max(1, ...flujoAcc);
    const n = 12, gw = plotW / n;
    const yBar = (v) => padT + plotH - (v/maxBar)*plotH*0.62;
    const yLine = (v) => padT + plotH - ((v-minAcc)/(maxAcc-minAcc || 1))*plotH;

    let svgHtml = "";
    // gridlines
    for (let g=0; g<=4; g++){ const y = padT + plotH*g/4; svgHtml += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }
    MONTH_LABELS.forEach((mLabel,i) => {
      const x0 = padL + i*gw;
      const bw = gw*0.30;
      const hI = plotH*0.62*(ing[i]/maxBar), hE = plotH*0.62*(egr[i]/maxBar);
      const xI = x0 + gw*0.16, xE = x0 + gw*0.54;
      svgHtml += `<rect data-t="ing-${i}" x="${xI}" y="${padT+plotH-hI}" width="${bw}" height="${Math.max(hI,0.5)}" rx="2.5" fill="var(--good)"/>`;
      svgHtml += `<rect data-t="egr-${i}" x="${xE}" y="${padT+plotH-hE}" width="${bw}" height="${Math.max(hE,0.5)}" rx="2.5" fill="var(--ink-faint)"/>`;
      svgHtml += `<text x="${x0+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--ink-faint)" font-family="IBM Plex Mono">${mLabel}</text>`;
    });
    // acumulado line
    const pts = flujoAcc.map((v,i) => [padL + i*gw + gw/2, yLine(v)]);
    const pathD = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    svgHtml += `<path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i) => { svgHtml += `<circle data-t="acc-${i}" cx="${p[0]}" cy="${p[1]}" r="3.4" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.4"/>`; });

    svg.innerHTML = svgHtml;
    svg.querySelectorAll("[data-t]").forEach(node => {
      node.addEventListener("mousemove", (e) => {
        const [kind,i] = node.getAttribute("data-t").split("-"); const idx = +i;
        const html = `<b>${MONTH_LABELS[idx]}</b><br>Ingresos: ${fmtMoney(ing[idx])}<br>Egresos: ${fmtMoney(egr[idx])}<br>Flujo acum.: ${fmtMoney(flujoAcc[idx])}`;
        showTip(e.clientX, e.clientY, html);
      });
      node.addEventListener("mouseleave", hideTip);
    });
  }

        let rows = "";
        p.partidas.forEach(part => {
          rows += `<tr><td>${part.label}</td><td class="num">${fmtMoney(part.presupuesto,{compact:true})}</td><td class="num">${fmtMoney(part.resultado,{compact:true})}</td></tr>`;
        });
        detail.innerHTML = `<table><thead><tr><th>Partida</th><th>Presupuesto</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table>`;
        card.appendChild(toggle);
        card.appendChild(detail);
      }
      grid.appendChild(card);
    });
  }

  function agingSeverityClass(bucketLabel){
    if (bucketLabel === "Al día (0-30d)") return "good";
    if (bucketLabel === "31-60 días") return "warning";
    return "critical"; // 61-90 y +90: mismo tono de riesgo alto, distinguibles por el monto y la etiqueta
  }
  function clientBucket(c){
    return (c.diasMora != null) ? agingBucket(c.diasMora) : "Sin fecha";
  }
  function renderCxCAging(cxc){
    if (!cxc.hasAging) return null;
    const total = Object.values(cxc.buckets).reduce((a,b)=>a+b,0);
    if (!total) return null;
    const card = el("div", {class:"hh-card", style:"margin-bottom:16px;"}, [ el("h3",{text:"Antigüedad de cartera (por fecha de documento)"}) ]);
    AGING_BUCKETS.concat("Sin fecha").forEach(label => {
      const val = cxc.buckets[label] || 0;
      if (!val) return;
      const sev = label === "Sin fecha" ? null : agingSeverityClass(label);
      const isActive = cxcFilter.bucket === label;
      const item = el("div", {class:"hh-item hh-item-click" + (isActive ? " active" : ""), title:"Ver los clientes de este tramo"}, [
        el("span", {class:"hh-name", text:label, title:label}),
        el("span", {class:"hh-track"}, [ el("span", {class:"hh-fill"}) ]),
        el("span", {class:"hh-val", text:fmtMoney(val,{compact:true})})
      ]);
      const fill = item.querySelector(".hh-fill");
      fill.style.width = (total ? val/total*100 : 0) + "%";
      if (sev) fill.style.background = "var(--" + sev + ")";
      item.addEventListener("click", () => { cxcFilter.bucket = (cxcFilter.bucket === label ? null : label); render(); });
      card.appendChild(item);
    });
    card.appendChild(el("div", {class:"bar-label", style:"margin-top:6px;"}, [ el("span",{text:"Clasificado por fecha del documento más antiguo de cada cliente. Sin fecha: bloques donde el archivo no trae columna de fecha detectable. Haz clic en un tramo para ver sus clientes."}) ]));
    return card;
  }
  function renderCxC(cxc){
    const wrap = $("cxcWrap"); wrap.innerHTML = "";
    if (!cxc.clients.length){ wrap.appendChild(el("div",{class:"empty-note", text:"Sube el Excel de Cuentas por Cobrar para ver esta sección."})); return; }
    const aging = renderCxCAging(cxc);
    if (aging) wrap.appendChild(aging);
    const filterActive = cxc.hasAging && cxcFilter.bucket;
    const visibleClients = filterActive ? cxc.clients.filter(c => clientBucket(c) === cxcFilter.bucket) : cxc.clients;
    if (filterActive){
      const subtotal = visibleClients.reduce((a,c)=>a+c.saldo,0);
      const bar = el("div", {class:"cxc-filter-bar"}, [
        el("span", {text:"Mostrando " + visibleClients.length + " cliente" + (visibleClients.length===1?"":"s") + " en \"" + cxcFilter.bucket + "\" · " + fmtMoney(subtotal)}),
        el("button", {class:"cxc-filter-clear", type:"button", text:"Ver todos ✕"})
      ]);
      bar.querySelector(".cxc-filter-clear").addEventListener("click", () => { cxcFilter.bucket = null; render(); });
      wrap.appendChild(bar);
    }
    const table = el("div", {class:"table-wrap"});
    let rows = "";
    visibleClients.forEach(c => {
      const pctTotal = cxc.grandTotal ? c.saldo/cxc.grandTotal : 0;
      const mora = c.diasMora != null ? c.diasMora + " d" : "—";
      rows += `<tr><td>${c.name}</td><td class="num">${c.code||""}</td><td class="num">${fmtMoney(c.saldo)}</td><td class="num">${pct(pctTotal)}</td><td class="num">${mora}</td></tr>`;
    });
    if (!visibleClients.length){
      rows = `<tr><td colspan="5" class="empty-note">No hay clientes en este tramo.</td></tr>`;
    }
    const totalRow = filterActive
      ? ""
      : `<tr class="total-row"><td>Total</td><td></td><td class="num">${fmtMoney(cxc.grandTotal)}</td><td class="num">100%</td><td></td></tr>`;
    table.innerHTML = `<table><thead><tr><th>Cliente</th><th>Código</th><th>Saldo</th><th>% del total</th><th>Antigüedad</th></tr></thead><tbody>${rows}${totalRow}</tbody></table>`;
    wrap.appendChild(table);
  }

  function hhBars(items, total, wrap){
    items.slice(0,7).forEach(([name,val]) => {
      const item = el("div", {class:"hh-item"}, [
        el("span", {class:"hh-name", text:name, title:name}),
        el("span", {class:"hh-track"}, [ el("span", {class:"hh-fill"}) ]),
        el("span", {class:"hh-val", text:fmtNum(val,1)})
      ]);
      item.querySelector(".hh-fill").style.width = (total ? val/total*100 : 0) + "%";
      wrap.appendChild(item);
    });
  }

  function renderHH(hh){
    const areaTabs = $("hhAreaTabs"), chips = $("hhPersonaChips"), stat = $("hhContextStat"), donutRow = $("hhDonutRow"), grid = $("hhGrid");
    areaTabs.innerHTML = ""; chips.innerHTML = ""; stat.textContent = ""; donutRow.innerHTML = ""; grid.innerHTML = "";
    if (!hh.porProyecto.length){ grid.appendChild(el("div",{class:"empty-note", text:"Sube el Excel de Horas Hombre (hoja \"Registro\", con columnas Persona, Proyecto y HH Trabajadas) para ver esta sección."})); return; }

    const hasRows = hh.rows && hh.rows.length > 0;
    if (hasRows && hh.porArea.length){
      // Vista por proyecto, al estilo del reporte de Power BI de Alex: un tab "Empresa total" +
      // un tab por área (Gerencia/Ingeniería/Terreno); al elegir un área aparecen chips por persona,
      // y las donas de abajo se recalculan sobre ese subconjunto sin volver a tocar el Excel.
      const allTab = el("button", {class:"hh-filter-tab" + (!hhFilter.area ? " active" : ""), type:"button", text:"Empresa total"});
      allTab.addEventListener("click", () => { hhFilter.area = null; hhFilter.persona = null; renderHH(hh); });
      areaTabs.appendChild(allTab);
      hh.porArea.forEach(([a]) => {
        const tab = el("button", {class:"hh-filter-tab" + (hhFilter.area===a ? " active" : ""), type:"button", text:a});
        tab.addEventListener("click", () => { hhFilter.area = (hhFilter.area===a ? null : a); hhFilter.persona = null; renderHH(hh); });
        areaTabs.appendChild(tab);
      });
      if (hhFilter.area){
        const personas = Array.from(new Set(hh.rows.filter(r => r.area===hhFilter.area).map(r => r.persona))).sort((a,b)=>a.localeCompare(b,"es"));
        personas.forEach(p => {
          const chip = el("button", {class:"hh-filter-chip" + (hhFilter.persona===p ? " active" : ""), type:"button", text:p});
          chip.addEventListener("click", () => { hhFilter.persona = (hhFilter.persona===p ? null : p); renderHH(hh); });
          chips.appendChild(chip);
        });
      }
      const agg = hhAggregate(hh.rows, hhFilter.area, hhFilter.persona);
      const label = hhFilter.persona || hhFilter.area || "Empresa total";
      stat.textContent = label + " · " + fmtNum(agg.total,1) + " h" + (hh.periodo ? " · " + hh.periodo : "");

      const c1 = el("div", {class:"donut-card"}, [ el("h3",{text:"Por proyecto"}) ]);
      c1.appendChild(donutChart(agg.porProyecto));
      donutRow.appendChild(c1);
      const c2 = el("div", {class:"donut-card"}, [ el("h3",{text:"Por tipo de cliente"}) ]);
      c2.appendChild(donutChart(agg.porCategoria));
      donutRow.appendChild(c2);
      if (!hhFilter.area && hh.porArea.length > 1){
        const c3 = el("div", {class:"donut-card"}, [ el("h3",{text:"Por área"}) ]);
        c3.appendChild(donutChart(hh.porArea));
        donutRow.appendChild(c3);
      }
    } else {
      // Sin detalle fila-a-fila (p.ej. formato plano de respaldo): donas fijas sobre los totales.
      const c1 = el("div", {class:"donut-card"}, [ el("h3",{text:"Por proyecto"}) ]);
      c1.appendChild(donutChart(hh.porProyecto));
      donutRow.appendChild(c1);
      if (hh.porCategoria.length){ const c2 = el("div",{class:"donut-card"},[el("h3",{text:"Por tipo de cliente"})]); c2.appendChild(donutChart(hh.porCategoria)); donutRow.appendChild(c2); }
      if (hh.porArea.length){ const c3 = el("div",{class:"donut-card"},[el("h3",{text:"Por área"})]); c3.appendChild(donutChart(hh.porArea)); donutRow.appendChild(c3); }
    }

    if (hh.porPersona && hh.porPersona.length){ const maxPe = Math.max(...hh.porPersona.map(x=>x[1])); const c5 = el("div",{class:"hh-card"},[el("h3",{text:"Por persona"})]); hhBars(hh.porPersona, maxPe, c5); grid.appendChild(c5); }
    if (hh.porMes && hh.porMes.length > 1){ const maxM = Math.max(...hh.porMes.map(x=>x[1])); const c6 = el("div",{class:"hh-card"},[el("h3",{text:"Por mes"})]); hhBars(hh.porMes, maxM, c6); grid.appendChild(c6); }
    if (hh.ejecucion && hh.ejecucion.length){
      const c6 = el("div", {class:"hh-card"}, [ el("h3",{text:"Ejecución HH vs. presupuesto"}) ]);
      hh.ejecucion.slice(0,7).forEach(p => {
        const ratio = p.presupuesto ? p.consumido/p.presupuesto : 0;
        const status = ratio > 1 ? "critical" : ratio > 0.85 ? "warning" : "good";
        c6.appendChild(el("div", {class:"proy-row"}, [ el("span",{text:p.name}), el("b",{text: fmtNum(p.consumido,1) + " / " + fmtNum(p.presupuesto,1) + " h"}) ]));
        const track = el("div", {class:"bar-track"}, [ el("div",{class:"bar-fill"}) ]);
        track.querySelector(".bar-fill").style.width = Math.min(ratio,1)*100 + "%";
        track.querySelector(".bar-fill").style.background = status==="critical" ? "var(--critical)" : status==="warning" ? "var(--warning)" : "var(--good)";
        c6.appendChild(track);
      });
      grid.appendChild(c6);
    }
  }

  render();
})();
</script>
</body>
</html>
